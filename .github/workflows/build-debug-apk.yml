name: Build Native Teacher Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify gradebook validation rules
        run: |
          mkdir -p build/gradebook-test
          javac -encoding UTF-8 -d build/gradebook-test app/src/main/java/ir/scooljavanrood/madreseyar/teacher/GradebookRules.java tools/TestGradebookRules.java
          java -cp build/gradebook-test ir.scooljavanrood.madreseyar.teacher.TestGradebookRules
      - name: Verify detailed exam statistics
        run: |
          mkdir -p build/exam-detail-test
          javac -encoding UTF-8 -d build/exam-detail-test app/src/main/java/ir/scooljavanrood/madreseyar/teacher/ExamDetailRules.java tools/TestExamDetailRules.java
          java -cp build/exam-detail-test ir.scooljavanrood.madreseyar.teacher.TestExamDetailRules
      - name: Build native test APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --console=plain 2>&1 | tee native-build.log
      - name: Show compiler errors
        if: failure()
        run: |
          grep -nE -B 5 -A 12 'error:|FAILURE:|What went wrong:|Execution failed' native-build.log | head -200 || true
          tail -50 native-build.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Native-A07-Build-Diagnostics
          path: native-build.log
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: Madreseyar-Teacher-A07-Native-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
